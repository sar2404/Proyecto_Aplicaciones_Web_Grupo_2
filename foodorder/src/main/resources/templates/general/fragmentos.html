<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      lang="es">

    <!-- ============================================================
         FRAGMENTO 1: HEAD
         ============================================================ -->
    <head th:fragment="head">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <title>[[#{aplicacion.titulo}]]</title>

        <!-- Bootstrap 5 (WebJar) -->
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"
              rel="stylesheet"/>

        <!-- Font Awesome (WebJar) -->
        <link th:href="@{/webjars/font-awesome/css/all.css}"
              rel="stylesheet"/>

        <!-- Bootstrap Icons (CDN) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
              rel="stylesheet"/>

        <!-- Google Fonts: Inter -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
              rel="stylesheet"/>

        <!-- CSS propio del proyecto (Integrante 4) -->
        <link th:href="@{/css/custom.css}" rel="stylesheet"/>
    </head>

    <body>

        <!-- ============================================================
             FRAGMENTO 2: HEADER (Navbar)
             ============================================================ -->
        <header th:fragment="header">
            <nav class="navbar navbar-expand-lg sticky-top bg-white border-bottom">
                <div class="container">

                    <!-- Logo -->
                    <a class="navbar-brand fw-bold fs-4" th:href="@{/}">
                        Food<span style="color: var(--fo-accent);">Order</span>
                    </a>

                    <!-- Botón hamburguesa (móvil) -->
                    <button class="navbar-toggler" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarPrincipal"
                            aria-controls="navbarPrincipal"
                            aria-expanded="false"
                            aria-label="Alternar navegación">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <!-- Contenido colapsable -->
                    <div class="collapse navbar-collapse" id="navbarPrincipal">
                        <ul class="navbar-nav mx-auto">
                            <li class="nav-item">
                                <a class="nav-link fw-semibold" th:href="@{/}">
                                    [[#{accion.inicio}]]
                                </a>
                            </li>
                            <li class="nav-item">
                                <!-- PENDIENTE: cambiar a th:href="@{/menu}" cuando exista MenuController -->
                                <a class="nav-link fw-semibold" href="#">Menú</a>
                            </li>
                            <li class="nav-item">
                                <!-- PENDIENTE: cambiar a th:href="@{/pedidos}" cuando exista PedidoController -->
                                <a class="nav-link fw-semibold" href="#">Mis pedidos</a>
                            </li>
                        </ul>

                        <div class="d-flex align-items-center gap-2">
                            <!-- Perfil -->
                            <a href="#" class="btn btn-outline-secondary rounded-3" aria-label="Perfil">
                                <i class="bi bi-person"></i>
                            </a>

                            <!-- Carrito -->
                            <a href="#" class="btn btn-fo-primary">
                                Ver carrito
                                <span class="badge bg-white ms-1" style="color: var(--fo-accent);">2</span>
                            </a>
                        </div>
                    </div>

                </div>
            </nav>
        </header>

        <!-- ============================================================
             FRAGMENTO 3: FOOTER
             ============================================================ -->
        <footer th:fragment="footer" class="bg-dark text-white-50 py-4 mt-auto">
            <div class="container d-flex justify-content-between flex-column flex-md-row gap-2">
                <small>© 2026 FoodOrder</small>
                <small>Privacidad · Términos</small>
            </div>
        </footer>

        <!-- ============================================================
             FRAGMENTO 4: SCRIPTS (al final del body, recomendado)
             ============================================================ -->
        <th:block th:fragment="scripts">
            <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
            <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
        </th:block>

    </body>
</html>
