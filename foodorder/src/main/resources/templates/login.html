<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <div class="row my-5 mx-0">
            <div class="col-md-4 offset-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white text-center">
                        <h2>[[#{login.login}]]</h2>
                    </div>
                    <div class="card-body">
                        <form method="POST" th:action="@{/login}">
                            <div class="row my-3">
                                <label for="correo" class="col-md-1 my-auto"><i class="fas fa-user-lock"></i></label>
                                <div class="col-md-11 my-auto">
                                    <input class="form-control" id="correo" type="email" name="correo" th:placeholder="#{login.username}" required/>
                                </div>
                            </div>
                            <div class="row my-3">
                                <label for="contrasena" class="col-md-1 my-auto"><i class="fas fa-key"></i></label>
                                <div class="col-md-11 my-auto">
                                    <input class="form-control" id="contrasena" type="password" name="contrasena" th:placeholder="#{login.password}" required/>
                                </div>
                            </div>
                            <div class="d-flex justify-content-around mt-4">
                                <a th:href="@{/registro/nuevo}" class="btn btn-primary"><i class="fas fa-user-plus"></i> [[#{accion.registrar}]]</a>
                                <button class="btn btn-success" type="submit"><i class="fas fa-sign-in-alt"></i> [[#{login.login}]]</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
