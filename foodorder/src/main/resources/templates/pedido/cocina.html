<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <main class="container mt-4">
            <div class="card p-2">
                <div class="card-header"><h4>[[#{pedido.cocina}]]</h4></div>
                <div class="card-body">
                    <div th:if="${!pedidos.empty}">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>[[#{pedido.numero}]]</th>
                                    <th>[[#{pedido.fecha}]]</th>
                                    <th>[[#{pedido.cliente}]]</th>
                                    <th>[[#{pedido.productos}]]</th>
                                    <th>[[#{pedido.estado}]]</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${pedidos}">
                                    <td>[[${p.idPedido}]]</td>
                                    <td>[[${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')}]]</td>
                                    <td>[[${p.usuario.nombre}]]</td>
                                    <td>
                                        <ul class="mb-0">
                                            <li th:each="d : ${p.detalles}">[[${d.cantidad}]] x [[${d.producto.nombre}]]</li>
                                        </ul>
                                    </td>
                                    <td>
                                        <form th:action="@{/pedido/estado}" method="post" class="d-flex gap-2">
                                            <input type="hidden" name="idPedido" th:value="${p.idPedido}"/>
                                            <select name="estado" class="form-select form-select-sm">
                                                <option th:each="e : ${estados}" th:value="${e}" th:selected="${e == p.estado}">[[${e}]]</option>
                                            </select>
                                            <button type="submit" class="btn btn-sm btn-warning"><i class="fas fa-pencil-alt"></i> [[#{accion.actualizar}]]</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${pedidos.empty}"><span>[[#{lista.vacia}]]</span></div>
                </div>
            </div>
        </main>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
