<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <main class="container mt-4">
            <h1>[[#{panel.titulo}]]</h1>
            <p>[[#{panel.descripcion}]]</p>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
                <div class="col">
                    <div class="card h-100 text-center p-3">
                        <h4><i class="fas fa-utensils"></i> [[#{plantilla.productos}]]</h4>
                        <a th:href="@{/producto/listado}" class="btn btn-primary mt-2">[[#{panel.administrar}]]</a>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 text-center p-3">
                        <h4><i class="fas fa-layer-group"></i> [[#{plantilla.categorias}]]</h4>
                        <a th:href="@{/categoria/listado}" class="btn btn-primary mt-2">[[#{panel.administrar}]]</a>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 text-center p-3">
                        <h4><i class="fas fa-users"></i> [[#{plantilla.usuarios}]]</h4>
                        <a th:href="@{/usuario/listado}" class="btn btn-primary mt-2">[[#{panel.administrar}]]</a>
                    </div>
                </div>
                <div class="col">
                    <div class="card h-100 text-center p-3">
                        <h4><i class="fas fa-receipt"></i> [[#{plantilla.todosPedidos}]]</h4>
                        <a th:href="@{/pedido/listado}" class="btn btn-primary mt-2">[[#{panel.administrar}]]</a>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
