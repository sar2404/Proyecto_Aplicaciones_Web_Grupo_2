<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>

        <!-- Fragmento 1, formulario unificado para agregar y modificar usuario -->
        <section th:fragment="formulario">
            <div class="row py-4 mb-2 mx-0 bg-light">
                <div class="col-md-1"></div>
                <div class="col-md-3">
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#usuarioModal" data-modo="agregar" th:data-titulo="#{usuario.agregar}"><i class="fa-solid fa-plus"></i> [[#{usuario.agregar}]]</button>
                </div>
            </div>
            <div class="modal fade" id="usuarioModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form id="usuarioForm" method="post" th:action="@{/usuario/guardar}">
                            <div class="modal-header" id="usuarioModalHeader">
                                <h5 class="modal-title" id="usuarioModalTitulo"></h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{accion.cerrar}"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="usuarioId" name="idUsuario"/>
                                <div class="mb-3">
                                    <label for="usuarioNombre">[[#{usuario.nombre}]]</label>
                                    <input type="text" id="usuarioNombre" name="nombre" maxlength="100" class="form-control" required/>
                                </div>
                                <div class="mb-3">
                                    <label for="usuarioCorreo">[[#{usuario.correo}]]</label>
                                    <input type="email" id="usuarioCorreo" name="correo" maxlength="100" class="form-control" required/>
                                </div>
                                <div class="mb-3">
                                    <label for="usuarioContrasena">[[#{usuario.contrasena}]]</label>
                                    <input type="password" id="usuarioContrasena" name="contrasena" minlength="8" class="form-control"/>
                                    <small class="text-muted">[[#{usuario.contrasena.ayuda}]]</small>
                                </div>
                                <div class="mb-3">
                                    <label for="usuarioRol">[[#{usuario.rol}]]</label>
                                    <select id="usuarioRol" name="rol" class="form-select" required>
                                        <option th:each="r : ${roles}" th:value="${r}">[[${r}]]</option>
                                    </select>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]</button>
                                <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Fragmento 2, listado de usuarios -->
        <section th:fragment="listado" class="p-3">
            <div class="row p-3">
                <div class="col-md-9">
                    <div class="card p-2">
                        <div class="card-header"><h4>[[#{usuario.listado}]]</h4></div>
                        <div class="card-body">
                            <div th:if="${usuarios != null and !usuarios.empty}">
                                <table class="table table-striped table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th>#</th>
                                            <th>[[#{usuario.nombre}]]</th>
                                            <th>[[#{usuario.correo}]]</th>
                                            <th>[[#{usuario.rol}]]</th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="u : ${usuarios}">
                                            <td>[[${u.idUsuario}]]</td>
                                            <td>[[${u.nombre}]]</td>
                                            <td>[[${u.correo}]]</td>
                                            <td>[[${u.rol}]]</td>
                                            <td class="text-nowrap">
                                                <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmModal" th:data-bs-id="${u.idUsuario}" th:data-bs-descripcion="${u.nombre}"><i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]</button>
                                                <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#usuarioModal" data-modo="editar" th:data-titulo="#{accion.actualizar}" th:data-id="${u.idUsuario}" th:data-nombre="${u.nombre}" th:data-correo="${u.correo}" th:data-rol="${u.rol}"><i class="fas fa-pencil-alt"></i> [[#{accion.actualizar}]]</button>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="text-center p-2" th:if="${usuarios == null or usuarios.empty}"><span>[[#{lista.vacia}]]</span></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-center bg-success text-white mb-3">
                        <div class="card-body">
                            <h3>[[#{usuario.total}]]</h3>
                            <h4 class="fs-2"><i class="fas fa-layer-group"></i> [[${totalUsuarios}]]</h4>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </body>
</html>
