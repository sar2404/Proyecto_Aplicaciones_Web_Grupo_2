<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="es">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <div class="row my-5 mx-0">
            <div class="col-md-4 offset-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white text-center">
                        <h2>[[#{registro.titulo}]]</h2>
                    </div>
                    <div class="card-body">
                        <form method="post" th:action="@{/registro/guardar}">
                            <div class="mb-3">
                                <label for="nombre">[[#{usuario.nombre}]]</label>
                                <input type="text" id="nombre" name="nombre" maxlength="100" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label for="correo">[[#{usuario.correo}]]</label>
                                <input type="email" id="correo" name="correo" maxlength="100" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label for="contrasena">[[#{usuario.contrasena}]]</label>
                                <input type="password" id="contrasena" name="contrasena" minlength="8" class="form-control" required/>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-success"><i class="fas fa-user-plus"></i> [[#{accion.registrar}]]</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
